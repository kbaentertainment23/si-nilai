<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Subtle Top Light Highlight -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Accent Green Gradient for Verification Badge -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sheet Plate Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E1B4B" flood-opacity="0.38" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064E3B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Inner Border Stroke & Specular Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="url(#glowGrad)" stroke-width="4" />

  <!-- Grid / Sheet Background Card -->
  <g transform="translate(100, 110)">
    <!-- White Spreadsheet Card Base -->
    <rect x="0" y="0" width="312" height="292" rx="28" fill="url(#sheetGrad)" opacity="0.98" />

    <!-- Card Header / Title bar -->
    <path d="M 0 28 C 0 12.536 12.536 0 28 0 L 284 0 C 299.464 0 312 12.536 312 28 L 312 56 L 0 56 Z" fill="#EEF2F6" />
    <circle cx="28" cy="28" r="6" fill="#CBD5E1" />
    <circle cx="48" cy="28" r="6" fill="#CBD5E1" />
    <circle cx="68" cy="28" r="6" fill="#CBD5E1" />

    <!-- Header Column dividers -->
    <line x1="84" y1="18" x2="84" y2="38" stroke="#E2E8F0" stroke-width="2" />
    <rect x="98" y="23" width="70" height="10" rx="5" fill="#94A3B8" />
    <rect x="220" y="23" width="48" height="10" rx="5" fill="#6366F1" />

    <!-- Row 1: Student 1 (Absen 1) -->
    <rect x="18" y="76" width="24" height="24" rx="6" fill="#4F46E5" />
    <text x="30" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
    <rect x="54" y="82" width="128" height="12" rx="6" fill="#334155" />
    <rect x="210" y="78" width="58" height="20" rx="6" fill="#E0E7FF" />
    <text x="239" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#4338CA" text-anchor="middle">100</text>

    <!-- Row 2: Student 2 (Absen 2) -->
    <rect x="18" y="124" width="24" height="24" rx="6" fill="#4F46E5" />
    <text x="30" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <rect x="54" y="130" width="104" height="12" rx="6" fill="#64748B" />
    <rect x="210" y="126" width="58" height="20" rx="6" fill="#E0E7FF" />
    <text x="239" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#4338CA" text-anchor="middle">95</text>

    <!-- Row 3: Student 3 (Absen 3) -->
    <rect x="18" y="172" width="24" height="24" rx="6" fill="#4F46E5" />
    <text x="30" y="189" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <rect x="54" y="178" width="118" height="12" rx="6" fill="#64748B" />
    <rect x="210" y="174" width="58" height="20" rx="6" fill="#E0E7FF" />
    <text x="239" y="189" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#4338CA" text-anchor="middle">92</text>

    <!-- Row 4: Student 4 (Absen 4) -->
    <rect x="18" y="220" width="24" height="24" rx="6" fill="#6366F1" />
    <text x="30" y="237" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <rect x="54" y="226" width="86" height="12" rx="6" fill="#94A3B8" />
    <rect x="210" y="222" width="58" height="20" rx="6" fill="#E0E7FF" />
    <text x="239" y="237" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#4338CA" text-anchor="middle">88</text>
  </g>

  <!-- Floating Dynamic Sort / Sync Emblem Badge in Bottom Right -->
  <g transform="translate(320, 310)" filter="url(#badgeShadow)">
    <circle cx="64" cy="64" r="62" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="6" />
    <!-- Checkmark & Sort arrows inside badge -->
    <path d="M 44 64 L 58 78 L 86 48" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkle in Top Left of Sheet -->
  <path d="M 120 75 Q 120 90 105 90 Q 120 90 120 105 Q 120 90 135 90 Q 120 90 120 75 Z" fill="#FDE047" opacity="0.9" />
</svg>
